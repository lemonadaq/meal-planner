name: Generuj dania

# Odpalane ręcznie: Actions → "Generuj dania" → Run workflow.
# Klucze siedzą w Settings → Secrets and variables → Actions:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_KEY, REPLICATE_KEY

on:
  workflow_dispatch:
    inputs:
      tryb:
        description: "Co zrobić"
        type: choice
        required: true
        default: wszystko
        options:
          - auto       # sam wymyśla `ile` nowych dań + przepis + zdjęcie
          - propozycje # tylko wymyśla nazwy i wypisuje je — nic nie zapisuje
          - import     # gotowe przepisy z skrypty/dania/*.json + zdjęcia (BEZ Anthropic)
          - wszystko   # przepis + zdjęcie dla dań z listy
          - przepisy   # same przepisy, bez zdjęć (bez kosztów Replicate)
          - obrazy     # zdjęcia dla dań, które są już w bazie bez zdjęcia
          - lista      # tylko wypisuje dania z bazy, nic nie zmienia, zero kosztów
          - usun       # KASUJE dania podane w polu `dania` — nieodwracalne
          - kuchnie    # dopisuje kuchnię i poziom trudności (suchy bieg, chyba że `zapisz`)
          - klucze     # sprawdza, czy klucze działają (kredyty!) — nic nie generuje
      ile:
        description: "Tryb 'auto'/'propozycje': ILE dań dodać (to jedyne pole, które trzeba wypełnić)"
        type: string
        required: false
        default: ""
      dania:
        description: "Lista dań: Bigos|obiad; Żurek|zupa ('obrazy' — puste = wszystkie bez zdjęcia; 'auto' — rozkład kuchni, np. polska:3, wloska:1; 'import' — nazwy plików JSON, puste = wszystkie)"
        type: string
        required: false
        default: ""
      limit:
        description: "Maks. dań w jednym przebiegu (0 = bez limitu)"
        type: string
        required: false
        default: "0"
      overwrite:
        description: "Nadpisz istniejące: w trybie 'obrazy' zdjęcia, w trybie 'przepisy' przepisy (gwiazdka i zdjęcie zostają)"
        type: boolean
        required: false
        default: false
      model_obrazu:
        description: "Model na Replicate (puste = black-forest-labs/flux-2-pro)"
        type: string
        required: false
        default: ""
      rodzaj:
        description: "Tryb 'lista': filtruj po rodzaju. Tryb 'auto': rozkład rodzajów, np. obiad:3, zupa:1 (puste = obiad, kolacja, sniadanie, deser, surowka)"
        type: string
        required: false
        default: ""
      tylko_ulubione:
        description: "Tryb 'lista': tylko dania oznaczone jako ulubione"
        type: boolean
        required: false
        default: false
      zapisz_liste:
        description: "Tryb 'lista': przepisz LISTA_DAN.md aktualnym stanem bazy i zacommituj"
        type: boolean
        required: false
        default: false
      zapisz:
        description: "Tryb 'kuchnie': FAKTYCZNIE zapisz (bez tego tylko pokazuje, co by przypisał)"
        type: boolean
        required: false
        default: false

# Dwa przebiegi naraz wchodziłyby sobie w drogę przy tych samych daniach.
concurrency:
  group: generuj-dania
  cancel-in-progress: false

jobs:
  generuj:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    # Potrzebne tylko po to, żeby tryb `lista` + `zapisz_liste` mógł
    # zacommitować odświeżony LISTA_DAN.md z powrotem do repo.
    permissions:
      contents: write

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
      REPLICATE_KEY: ${{ secrets.REPLICATE_KEY }}
      DANIA: ${{ inputs.dania }}
      LIMIT: ${{ inputs.limit }}
      ILE: ${{ inputs.ile }}
      # W trybach `auto`/`propozycje` pola `dania` i `rodzaj` znaczą co innego:
      # nie listę dań i filtr, a rozkład kuchni i rodzajów.
      KUCHNIE_PLAN: ${{ (inputs.tryb == 'auto' || inputs.tryb == 'propozycje') && inputs.dania || '' }}
      RODZAJE_PLAN: ${{ (inputs.tryb == 'auto' || inputs.tryb == 'propozycje') && inputs.rodzaj || '' }}
      OVERWRITE: ${{ inputs.overwrite && '1' || '0' }}
      REPLICATE_MODEL: ${{ inputs.model_obrazu }}
      RODZAJ: ${{ inputs.rodzaj }}
      ULUBIONE: ${{ inputs.tylko_ulubione && '1' || '0' }}
      ZAPISZ_LISTE: ${{ inputs.zapisz_liste && '1' || '0' }}
      ZAPISZ: ${{ inputs.zapisz && '1' || '0' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sprawdź sekrety
        run: |
          # Tryb `klucze` sam sprawdza klucze i mówi, co z nimi jest nie tak —
          # nie ma sensu ubiegać go błędem o brakującym sekrecie.
          if [ "${{ inputs.tryb }}" = "klucze" ]; then exit 0; fi
          brakuje=0
          for zmienna in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!zmienna}" ]; then echo "::error::brak sekretu $zmienna"; brakuje=1; fi
          done
          # tryb 'lista' tylko czyta bazę — nie potrzebuje ani Claude'a, ani Replicate
          case "${{ inputs.tryb }}" in lista|usun|import) potrzebnyClaude=0 ;; *) potrzebnyClaude=1 ;; esac
          if [ "$potrzebnyClaude" = 1 ] && [ -z "$ANTHROPIC_KEY" ]; then
            echo "::error::brak sekretu ANTHROPIC_KEY"; brakuje=1
          fi
          case "${{ inputs.tryb }}" in
            wszystko|obrazy|auto|import)
              if [ -z "$REPLICATE_KEY" ]; then echo "::error::brak sekretu REPLICATE_KEY"; brakuje=1; fi ;;
          esac
          exit $brakuje

      - name: Generuj
        run: |
          case "${{ inputs.tryb }}" in
            auto)     node skrypty/generuj-auto.mjs ;;
            propozycje) TYLKO_PROPOZYCJE=1 node skrypty/generuj-auto.mjs ;;
            import)   node skrypty/importuj-dania.mjs ;;
            klucze)   node skrypty/sprawdz-klucze.mjs ;;
            wszystko) node skrypty/generuj-wszystko.mjs ;;
            przepisy) node skrypty/generuj-przepisy.mjs ;;
            obrazy)   node skrypty/generuj-obrazy.mjs ;;
            lista)    node skrypty/lista.mjs ;;
            usun)     node skrypty/usun.mjs ;;
            kuchnie)  node skrypty/uzupelnij-kuchnie.mjs ;;
          esac

      - name: Zacommituj odświeżoną listę dań
        if: inputs.tryb == 'lista' && inputs.zapisz_liste
        run: |
          if git diff --quiet -- LISTA_DAN.md; then
            echo "LISTA_DAN.md bez zmian — nie ma czego commitować."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LISTA_DAN.md
          git commit -m "Odświeżenie LISTA_DAN.md ze stanu bazy

          Wygenerowane przez workflow \"Generuj dania\" (tryb lista, zapisz_liste)."
          git push
