name: Wydanie Android

# Ręcznie z zakładki Actions — żeby dało się wydać z telefonu, bez Android
# Studio i bez SDK na własnym komputerze. Efektem jest plik .aab do wgrania
# w Play Console (artefakt przebiegu, do pobrania przez przeglądarkę).
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Wersja widoczna dla użytkownika, np. 1.0.1"
        type: string
        required: true
        default: "1.0.0"
      version_code:
        description: "Numer kompilacji — MUSI rosnąć z każdym wydaniem (Play odrzuca powtórzony)"
        type: string
        required: true
        default: "1"
      podpisz:
        description: "Podpisz kluczem z sekretów (bez tego wyjdzie artefakt niepodpisany, tylko do sprawdzenia)"
        type: boolean
        required: false
        default: true

jobs:
  wydanie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Zainstaluj zależności
        run: npm ci

      # Bundle webowy wchodzi do APK jako assety — apka natywna nie pobiera
      # strony z sieci, tylko ma ją u siebie. Z sieci idzie wyłącznie Supabase.
      # Adres bierzemy z VITE_SUPABASE_URL, a gdy go nie ma — z SUPABASE_URL,
      # którego używają już inne workflow. To ta sama wartość, więc nie ma
      # sensu kazać jej wpisywać drugi raz.
      #
      # Dla klucza żadnego fallbacku NIE MA i to jest celowe: jedyny klucz
      # Supabase, który tu leży, to SUPABASE_SERVICE_ROLE_KEY — a ten omija
      # całe RLS. Wszedłby do pliku APK, skąd każdy może go wyjąć, i dałby
      # obcym pełny dostęp do bazy.
      - name: Zbuduj stronę
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Brak adresu Supabase — dodaj sekret VITE_SUPABASE_URL albo SUPABASE_URL."
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Brak sekretu VITE_SUPABASE_ANON_KEY."
            echo "::error::To klucz ANON (publiczny, ten sam co na stronie w Vercelu)."
            echo "::error::NIE podstawiaj pod niego SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi

          # Bezpiecznik przed najgorszą możliwą pomyłką w tym workflow.
          # Klucz serwisowy w pliku APK = pełny dostęp do bazy dla każdego,
          # kto ten plik pobierze ze sklepu. Rozpoznajemy oba formaty, jakie
          # Supabase wydaje: JWT z rolą w środku i nowszy `sb_secret_...`.
          if printf '%s' "$VITE_SUPABASE_ANON_KEY" | grep -q '^sb_secret_'; then
            echo "::error::To jest klucz SEKRETNY (sb_secret_...), nie anon. Przerywam."
            exit 1
          fi
          ROLA=$(printf '%s' "$VITE_SUPABASE_ANON_KEY" | cut -d. -f2 \
                 | tr '_-' '/+' | base64 -d 2>/dev/null \
                 | grep -o '"role" *: *"[^"]*"' | cut -d'"' -f4 || true)
          if [ "$ROLA" = "service_role" ]; then
            echo "::error::Pod VITE_SUPABASE_ANON_KEY podstawiono klucz service_role."
            echo "::error::Ten klucz omija RLS i trafiłby do pliku APK. Przerywam."
            exit 1
          fi
          echo "Klucz Supabase wygląda na anon (rola: ${ROLA:-nierozpoznana})."

          npm run build

      - name: Testy
        run: npx vitest run

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Przenieś bundle do projektu Androida
        run: npx cap sync android

      # Numer wersji ustawiamy TU, a nie w repo: Play odrzuca wgranie pliku
      # z versionCode, który już kiedyś był, a pamiętanie o ręcznym bumpie
      # przed każdym wydaniem to prosta droga do pomyłki.
      - name: Ustaw numer wersji
        env:
          NAZWA: ${{ inputs.version_name }}
          KOD: ${{ inputs.version_code }}
        run: |
          cd android/app
          sed -i "s/versionCode .*/versionCode ${KOD}/" build.gradle
          sed -i "s/versionName \".*\"/versionName \"${NAZWA}\"/" build.gradle
          grep -n "versionCode\|versionName" build.gradle

      - name: Odtwórz klucz podpisujący
        if: ${{ inputs.podpisz }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Brak sekretu ANDROID_KEYSTORE_BASE64 — nie ma czym podpisać."
            echo "::error::Albo dodaj sekret, albo odpal ponownie z odznaczonym „podpisz”."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/klucz.jks"
          echo "Klucz odtworzony ($(stat -c%s "$RUNNER_TEMP/klucz.jks") bajtów)"

      - name: Zbuduj AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ inputs.podpisz && format('{0}/klucz.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      # APK obok AAB — do wrzucenia na telefon i sprawdzenia przed wysłaniem
      # czegokolwiek do sklepu. Play przyjmuje AAB, ale AAB-a nie zainstalujesz.
      - name: Zbuduj APK do testów na telefonie
        env:
          ANDROID_KEYSTORE_FILE: ${{ inputs.podpisz && format('{0}/klucz.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Sprawdź, czy artefakt jest podpisany
        if: ${{ inputs.podpisz }}
        run: |
          APK=$(find android -name "*-release.apk" | head -1)
          echo "Sprawdzam: $APK"
          # apksigner leży w build-tools; bierzemy najnowsze dostępne
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Usuń klucz z runnera
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/klucz.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: menuplaner-${{ inputs.version_name }}-${{ inputs.version_code }}
          retention-days: 14
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
