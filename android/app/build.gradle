apply plugin: 'com.android.application'

// Klucz podpisujący i hasła przychodzą ze zmiennych środowiskowych, nigdy
// z repozytorium. W GitHub Actions wstrzykuje je workflow „Wydanie Android"
// z sekretów; lokalnie wystarczy wyeksportować te same cztery zmienne.
// Bez nich build release nadal przechodzi — wychodzi tylko niepodpisany
// artefakt, przydatny do sprawdzenia, czy kod się w ogóle kompiluje.
def plikKlucza = System.getenv("ANDROID_KEYSTORE_FILE")
def mamyKlucz = plikKlucza != null && !plikKlucza.isEmpty() && file(plikKlucza).exists()

android {
    // UWAGA: w tym pliku krążą TRZY różne nazwy i to jest celowe.
    //
    // 1. `namespace` — przestrzeń pakietów Javy. Zostaje `com.menuplaner.app`,
    //    bo tam fizycznie leży `MainActivity.java`. Zmiana wymagałaby
    //    przeniesienia pliku, a Play tej nazwy w ogóle nie widzi.
    // 2. `applicationId` — nazwa, którą czyta Play Console. Musi być
    //    `pl.menuplaner`, bo pod taką nazwą założona jest aplikacja
    //    w konsoli; wgranie AAB z inną kończy się odrzuceniem. Po pierwszym
    //    przyjętym wydaniu jest NIEODWRACALNA.
    // 3. Schemat deep linku `com.menuplaner.app` w `AndroidManifest.xml` —
    //    adres powrotny logowania Google (`com.menuplaner.app://login-callback`
    //    w `src/App.jsx` i `src/pages/Login.jsx`). Jest wpisany w Supabase
    //    jako dozwolony redirect, więc ZOSTAJE stary. Zmiana tu = logowanie
    //    Google w apce przestaje działać do czasu poprawki w Supabase.
    //
    // Nie „ujednolicaj" ich do jednej wartości.
    namespace = "com.menuplaner.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pl.menuplaner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (mamyKlucz) {
                storeFile file(plikKlucza)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // minifyEnabled zostaje wyłączone: to WebView ładujący gotowy
            // bundle z `dist`, więc R8 nie ma tu czego skracać, a potrafi
            // zepsuć refleksję we wtyczkach Capacitora.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (mamyKlucz) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
